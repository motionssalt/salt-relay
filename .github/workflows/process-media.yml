name: Salt Relay Media Processing

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Job ID'
        required: true
        type: string
      media_json:
        description: 'JSON list of media sources to process'
        required: true
        type: string
      callback_url:
        description: 'Webhook callback URL'
        required: true
        type: string
      callback_secret:
        description: 'Callback authentication secret'
        required: false
        type: string

permissions:
  contents: write

jobs:
  process-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache FFmpeg Static Binary
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /opt/ffmpeg
          key: ffmpeg-static-linux64-v1

      - name: Install FFmpeg (Static Binary with Resilient Fallback)
        timeout-minutes: 5
        run: |
          START_TIME=$(date +%s)
          echo "=== Fast FFmpeg Installation ==="
          sudo mkdir -p /opt/ffmpeg
          sudo chown -R $USER:$USER /opt/ffmpeg

          INSTALLED=false

          # 1. Check if cached binary is already present and operational
          if [ -x "/opt/ffmpeg/ffmpeg" ] && [ -x "/opt/ffmpeg/ffprobe" ]; then
            echo "Checking cached FFmpeg binary..."
            if /opt/ffmpeg/ffmpeg -version >/dev/null 2>&1; then
              echo "Cached static FFmpeg binary verified."
              INSTALLED=true
            fi
          fi

          # 2. Method 1: Fast static binary download from GitHub network (BtbN FFmpeg Builds)
          if [ "$INSTALLED" = false ]; then
            echo "Downloading static FFmpeg build from GitHub Releases..."
            FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            if curl -fSL --connect-timeout 15 --max-time 120 "$FFMPEG_URL" -o /tmp/ffmpeg.tar.xz; then
              echo "Extracting FFmpeg static archive..."
              tar -xf /tmp/ffmpeg.tar.xz -C /tmp
              EXTRACTED_BIN=$(find /tmp -type f -name "ffmpeg" -perm -u+x | head -n 1)
              EXTRACTED_PROBE=$(find /tmp -type f -name "ffprobe" -perm -u+x | head -n 1)
              if [ -n "$EXTRACTED_BIN" ] && [ -n "$EXTRACTED_PROBE" ]; then
                cp "$EXTRACTED_BIN" /opt/ffmpeg/ffmpeg
                cp "$EXTRACTED_PROBE" /opt/ffmpeg/ffprobe
                chmod +x /opt/ffmpeg/ffmpeg /opt/ffmpeg/ffprobe
                rm -rf /tmp/ffmpeg*
                INSTALLED=true
                echo "FFmpeg static binary installed successfully into /opt/ffmpeg."
              fi
            else
              echo "Warning: Static binary download from GitHub network failed or timed out."
            fi
          fi

          # 3. Method 2: Resilient apt fallback with --no-install-recommends
          if [ "$INSTALLED" = false ]; then
            echo "Falling back to apt-get with resilience flags..."
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              ffmpeg
            INSTALLED=true
          fi

          # 4. Add /opt/ffmpeg to PATH if static binary was installed
          if [ -f "/opt/ffmpeg/ffmpeg" ]; then
            echo "/opt/ffmpeg" >> $GITHUB_PATH
          fi

          END_TIME=$(date +%s)
          ELAPSED=$((END_TIME - START_TIME))
          echo "FFmpeg installation completed in ${ELAPSED} seconds."

      - name: Verify FFmpeg and Encoders
        run: |
          echo "=== Verifying FFmpeg Installation ==="
          ffmpeg -version | head -n 3
          ffprobe -version | head -n 3

          echo "Checking video encoder: libx264..."
          if ! ffmpeg -encoders 2>/dev/null | grep -q "libx264"; then
            echo "ERROR: libx264 video encoder is missing!"
            exit 1
          fi
          echo "libx264 verified."

          echo "Checking audio encoder: aac..."
          if ! ffmpeg -encoders 2>/dev/null | grep -q "aac"; then
            echo "ERROR: aac audio encoder is missing!"
            exit 1
          fi
          echo "aac verified."
          echo "All FFmpeg components verified."

      - name: Process Media Pipeline
        id: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          MEDIA_JSON: ${{ github.event.inputs.media_json }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET || github.event.inputs.callback_secret }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/process-media-runner.cjs
